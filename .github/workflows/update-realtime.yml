name: 실시간 빈자리 갱신

on:
  schedule:
    # 10분마다 (깃허브 사정에 따라 몇 분 늦을 수 있다)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # 저장소 Actions 탭에서 손으로도 돌릴 수 있다

permissions:
  contents: write

concurrency:
  group: update-realtime
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 실시간 빈자리 받아오기
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          KOTSA_API_KEY: ${{ secrets.KOTSA_API_KEY }}
          # 이름을 PARK_1 / PARK_2 로 넣어둔 경우도 받는다 (키 길이로 자동 구분)
          PARK_1: ${{ secrets.PARK_1 }}
          PARK_2: ${{ secrets.PARK_2 }}
        run: node scripts/build-realtime.mjs

      - name: 바뀌었으면 저장소에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/realtime.json
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "실시간 빈자리 갱신 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
